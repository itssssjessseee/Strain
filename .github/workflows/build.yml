name: Build macOS plugins
on:
  push:
  workflow_dispatch:
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -G Xcode
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Validate Audio Unit
        run: |
          killall -9 AudioComponentRegistrar || true
          auval -v aumu Stn1 Strn
      - name: Package
        run: |
          cd build/Strain_artefacts/Release
          ditto -c -k --keepParent VST3/Strain.vst3 "$GITHUB_WORKSPACE/Strain-VST3.zip"
          ditto -c -k --keepParent AU/Strain.component "$GITHUB_WORKSPACE/Strain-AU.zip"
          ditto -c -k --keepParent Standalone/Strain.app "$GITHUB_WORKSPACE/Strain-Standalone.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Strain-macOS
          path: Strain-*.zip
