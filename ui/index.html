<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Strain Synthesizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Barlow+Semi+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: fixed hardware frame. header / section tabs / scrolling control panel / performance strip + keyboard */
  --bg:#110c0d; --panel:#1a1415; --raise:#261c1d; --line:#402f30; --ink:#efe6dc; --dim:#a8958c;
  --led:#ff4a36; --amber:#f2b55a; --key:#e8ded2;
  --f-d:'Syncopate','Arial Black',sans-serif; --f-b:'Barlow Semi Condensed','Arial Narrow',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:500 14px/1.3 var(--f-b);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
#app{height:100%;max-width:1180px;margin:0 auto;display:flex;flex-direction:column;background:var(--panel);border-inline:1px solid var(--line)}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 16px 8px;border-bottom:1px solid var(--line);background:linear-gradient(#211819,#1a1415)}
.brand{display:flex;flex-direction:column;gap:2px}
.brand b{font:700 17px/1 var(--f-d);letter-spacing:.14em}
.brand b i{color:var(--led);font-style:normal}
.brand span{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
#scope{flex:1 1 90px;min-width:70px;height:38px;border:1px solid var(--line);border-radius:3px;background:#0b0708}
.patchbar{display:flex;gap:6px;align-items:center;flex:1 1 260px;min-width:0}
.patchbar select{flex:1;min-width:0}
#status{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--dim);letter-spacing:.04em;flex-basis:100%}
.dot{width:7px;height:7px;border-radius:50%;background:#4a3536;flex:none}
.dot.on{background:var(--led);box-shadow:0 0 8px var(--led)}
select,.btn{background:var(--raise);border:1px solid var(--line);border-radius:3px;height:32px;padding:0 9px;font-weight:500}
.btn{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-transform:uppercase;letter-spacing:.07em;font-size:12px}
.btn:active{background:#34272a}
.btn.hot{border-color:var(--led);color:#fff;background:#3a1a17}
.btn.on{border-color:var(--amber);color:var(--amber)}
nav{display:flex;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none;flex:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:1 0 auto;background:none;border:0;border-bottom:2px solid transparent;padding:10px 13px 8px;font-size:12.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
nav button.on{color:var(--ink);border-bottom-color:var(--led)}
nav button.fx{color:var(--amber)}
nav button.fx.on{border-bottom-color:var(--amber)}
main{flex:1;min-height:0;overflow-y:auto;padding:12px 16px 20px}
.tab{display:none;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));align-items:start}
.tab.on{display:grid}
.grp{border:1px solid var(--line);border-radius:5px;background:#1e1718;padding:10px 12px 12px;display:flex;flex-direction:column;gap:10px}
.grp h3{font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);display:flex;align-items:center;gap:8px}
.grp h3::before{content:"";width:14px;height:2px;background:var(--led)}
.grp.fxg h3::before{background:var(--amber)}
.grp p{font-size:13px;color:var(--dim);font-weight:400;line-height:1.4;max-width:60ch}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
.sel{display:flex;flex-direction:column;gap:3px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);min-width:0}
.sel select{text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink);max-width:100%}
.seg{display:flex}
.seg button{background:var(--raise);border:1px solid var(--line);height:32px;padding:0 11px;font-size:13px;margin-left:-1px;color:var(--dim)}
.seg button:first-child{border-radius:3px 0 0 3px;margin-left:0}.seg button:last-child{border-radius:0 3px 3px 0}
.seg button.on{background:#3a1a17;color:#fff;border-color:var(--led);position:relative;z-index:1}
.tog i{width:7px;height:7px;border-radius:50%;background:#4a3536}
.tog.on{color:#fff}.tog.on i{background:var(--led);box-shadow:0 0 7px var(--led)}
.knobs{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:10px 4px}
.knob{display:flex;flex-direction:column;align-items:center;touch-action:none;cursor:ns-resize;border-radius:4px}
.knob svg{width:46px;height:46px;display:block}
.knob circle.trk,.knob circle.arc{fill:none;stroke-width:3}
.knob .trk{stroke:var(--line)}.knob .arc{stroke:var(--led)}
.knob .ptr circle{fill:#30383a;fill:#2f2425;stroke:#4e3b3c}
.knob .ptr line{stroke:var(--ink);stroke-width:2.2;stroke-linecap:round}
.kv{font-size:12px;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:1px;white-space:nowrap}
.kl{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);text-align:center;line-height:1.15;margin-top:1px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(70px,1.1fr) 34px minmax(0,1fr);gap:6px;align-items:center}
.mrow select{width:100%;padding:0 4px;font-size:13px}
.mrow output{font-size:12px;font-variant-numeric:tabular-nums;text-align:right}
input[type=range]{accent-color:var(--led);width:100%;min-width:0;touch-action:pan-y}
.steps{display:grid;grid-template-columns:repeat(16,1fr);gap:3px}
.steps button{aspect-ratio:1/1.5;min-width:0;border:1px solid var(--line);border-radius:2px;background:#150f10;padding:0}
.steps button:nth-child(4n+1){border-top-color:var(--dim)}
.steps button.s1{background:#7a2a22}.steps button.s2{background:var(--led);box-shadow:0 0 6px rgba(255,74,54,.6)}
.pads{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:6px}
.pad{height:62px;border:1px solid var(--line);border-radius:4px;background:var(--raise);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;touch-action:none;padding:0 4px}
.pad b{font-size:16px;font-weight:600}.pad span{font-size:11px;color:var(--dim);letter-spacing:.08em}
.pad.now{border-color:var(--amber);background:#3a2c18}.pad.dn{background:#3a1a17;border-color:var(--led)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
#morph{position:relative;width:min(100%,300px);aspect-ratio:1;border:1px solid var(--line);border-radius:4px;touch-action:none;
  background:linear-gradient(var(--line) 1px,transparent 1px) 0 0/25% 25%,linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/25% 25%,#150f10}
#morph em{position:absolute;font:700 11px var(--f-d);color:var(--dim);font-style:normal}
#morph em:nth-of-type(1){left:7px;top:6px}#morph em:nth-of-type(2){right:7px;top:6px}#morph em:nth-of-type(3){left:7px;bottom:6px}#morph em:nth-of-type(4){right:7px;bottom:6px}
#mh{position:absolute;width:26px;height:26px;margin:-13px;border-radius:50%;border:2px solid var(--amber);background:rgba(242,181,90,.25);left:0;top:0;pointer-events:none}
footer{flex:none;border-top:1px solid var(--line);background:#150f10}
#strip{display:flex;gap:6px;padding:7px 16px;overflow-x:auto;align-items:center;scrollbar-width:none}
#strip::-webkit-scrollbar{display:none}
#strip>*{flex:none}
#strip .oct{min-width:44px;text-align:center;font-variant-numeric:tabular-nums;color:var(--dim);font-size:12px;letter-spacing:.08em}
#kb{position:relative;height:clamp(118px,22vh,170px);touch-action:none;margin:0 6px 6px;display:flex;gap:2px}
#kb.padsL{display:grid;grid-template-rows:1fr 1fr;gap:4px;margin:0 16px 8px}
.key.w{flex:1;background:var(--key);border-radius:0 0 4px 4px;position:relative}
.key.w.out{background:#8d837b}
.key.b{position:absolute;top:0;height:60%;background:#171011;border:1px solid #000;border-top:0;border-radius:0 0 3px 3px;z-index:2}
.key.b.out{background:#3b3032}
.key.in::after{content:"";position:absolute;left:50%;bottom:8px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--led);opacity:.75}
.key.root::after{background:var(--amber);opacity:1;width:8px;height:8px;margin-left:-4px}
.key.w.dn{background:#ffb9a8}.key.b.dn{background:var(--led)}
.prow{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;min-height:0}
.key.p{border:1px solid var(--line);border-radius:4px;background:var(--raise);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;position:relative;overflow:hidden;white-space:nowrap}
.key.p.root{border-left:3px solid var(--amber)}
.key.p.dn{background:#5a211b;border-color:var(--led)}
@media (max-width:420px){.kl{font-size:9.5px}.steps{gap:2px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><b>STR<i>A</i>IN</b><span>Virtual analog &#xb7; 12 voices</span></div>
    <canvas id="scope" aria-label="Output waveform"></canvas>
    <div class="patchbar">
      <button class="btn" id="pPrev" aria-label="Previous patch">&#x25c0;</button>
      <select id="pSel" aria-label="Patch"></select>
      <button class="btn" id="pNext" aria-label="Next patch">&#x25b6;</button>
      <button class="btn" id="pSave">Save</button>
    </div>
    <div id="status"><i class="dot" id="led"></i><span id="stxt">Tap a key to start the audio engine. On iPhone, switch off silent mode.</span></div>
  </header>
  <nav id="tabs"></nav>
  <main id="panel"></main>
  <footer>
    <div id="strip"></div>
    <div id="kb"></div>
  </footer>
</div>
<script>
function makeEngine(){
'use strict';
const TAU=6.283185307179586,NV=12,TS=2048,NT=6,NF=8,NM=7;
const HC=[0,-1,1,-0.57,0.57,-0.18,0.18];
const ARPDIV=[1,0.5,1/3,0.25,1/6,0.125];
const DLB=[0.25,0.5,0.75,1,1.5,2,1/3,2/3];
const LFB=[16,8,4,3,2,1,0.5,0.25,0.125];
const RVB=[1153,1327,1559,1801,2069,2311,2617,2903];
const clp=(x,a,b)=>x<a?a:x>b?b:x;
const tanh=x=>{if(x>3)return 1;if(x<-3)return -1;const x2=x*x;return x*(27+x2)/(27+9*x2);};
function pb(t,dt){if(t<dt){t/=dt;return t+t-t*t-1;}if(t>1-dt){t=(t-1)/dt;return t*t+t+t+1;}return 0;}
// classic oscillator: sine -> saw -> pulse morph, band-limited
function cv(ph,inc,sh,w){
  const saw=2*ph-1-pb(ph,inc);
  if(sh<0.5){const s=-Math.sin(TAU*ph);return s+(saw-s)*sh*2;}
  let p2=ph+w;if(p2>=1)p2-=1;
  const pul=saw-(2*p2-1-pb(p2,inc));
  return saw+(pul-saw)*(sh-0.5)*2;
}
function es(env,S,ca,cd,cr){
  if(env.s===1){env.v+=(1.25-env.v)*ca;if(env.v>=1){env.v=1;env.s=2;}}
  else if(env.s===2){env.v+=(S-env.v)*cd;}
  else if(env.s===3){env.v-=env.v*cr;if(env.v<1e-4){env.v=0;env.s=0;}}
  return env.v;
}
function svf(sv,j,x,k,a1,a2,a3,type,bg){
  const v3=x-sv[j+1],v1=a1*sv[j]+a2*v3,v2=sv[j+1]+a2*sv[j]+a3*v3;
  sv[j]=2*v1-sv[j];sv[j+1]=2*v2-sv[j+1];
  return type===1?v2:type===2?v1*bg:type===3?x-k*v1-v2:x-k*v1;
}
function sat(x,type,g,mk){
  switch(type){
    case 1:return tanh(x*g)*mk;
    case 2:x*=g;return (x>1?1:x<-1?-1:x)*mk;
    case 3:return Math.sin(x*g);
    case 4:return (Math.abs(tanh(x*g))-0.35)*1.4*mk;
    case 5:return Math.round(x*g)/g;
  }
  return x;
}
// ---------- wavetables ----------
let WT=null;
function amp(t,x,h){
  switch(t){
    case 0:{const c=1+x*x*70,lp=1/(1+Math.pow(h/c,4)),d=(h-c)/(0.2*c+0.6);return (1/h)*lp*(1+1.5*Math.exp(-d*d));}
    case 1:{const V=[[800,1150,2900],[400,2000,2600],[270,2300,3000],[450,800,2830],[325,700,2700]];
      const v=x*4,i=Math.min(3,Math.floor(v)),f=v-i,fr=h*110;let a=0;
      for(let k=0;k<3;k++){const F=V[i][k]+(V[i+1][k]-V[i][k])*f,bw=90+k*40+F*0.04,d=(fr-F)/bw;a+=Math.exp(-d*d)*(k===0?1:k===1?0.6:0.3);}
      return a+(h===1?0.35:h===2?0.15:0.01/h);}
    case 2:{const d=0.5-x*0.45;return Math.sin(Math.PI*h*d)/h;}
    case 3:{const B=[1,3,5,9,13,19,27,37],i=B.indexOf(h);return i<0?0:Math.exp(-i*(1.3-x*1.1))*(i%2?0.8:1);}
    case 4:{const c=0.5+0.5*Math.cos(h*(0.35+x*2.6));return c*c/Math.pow(h,0.8);}
    default:{const D=[1,2,3,4,6,8,10,12,16],i=D.indexOf(h);if(i<0)return 0;
      return [1,0.9-x*0.5,0.3+x*0.6,x*0.9,0.5*x,x*x,0.4*x*x,0.3*x*x,0.5*x*x*x+0.02][i];}
  }
}
function buildWT(){
  const sinT=new Float32Array(TS);for(let i=0;i<TS;i++)sinT[i]=Math.sin(TAU*i/TS);
  const W=[];
  for(let t=0;t<NT;t++){const F=[];
    for(let f=0;f<NF;f++){const x=f/(NF-1),acc=new Float32Array(TS),M=new Array(NM);let h=1;
      for(let m=NM-1;m>=0;m--){const H=256>>m;
        for(;h<=H;h++){const a=amp(t,x,h);if(Math.abs(a)<1e-5)continue;
          for(let i=0,j=0;i<TS;i++){acc[i]+=a*sinT[j];j=(j+h)&(TS-1);}}
        const b=new Float32Array(TS+1);b.set(acc);b[TS]=acc[0];M[m]=b;}
      let pk=0,sq=0;for(let i=0;i<TS;i++){const a=M[0][i];sq+=a*a;if(Math.abs(a)>pk)pk=Math.abs(a);}
      const rms=Math.sqrt(sq/TS),g=Math.min(1.5/(pk||1),0.5/(rms||1));
      for(let m=0;m<NM;m++){const b=M[m];for(let i=0;i<=TS;i++)b[i]*=g;}
      F.push(M);}
    W.push(F);}
  return W;
}
function osc(q,m,f,s,w){
  if(m===0){let ph=q.ph+f;if(ph>=1||ph<0){q.w=ph>=1?1:0;ph-=Math.floor(ph);}else q.w=0;q.ph=ph;
    const a=f<0?-f:f;return cv(ph,a>0.49?0.49:a,s,w);}
  if(m===1){const hp=q.hp,hi=q.hi;let sum=0;
    for(let k=0;k<7;k++){const d=hi[k];let ph=hp[k]+d;
      if(ph>=1){ph-=1;if(k===0)q.w=1;}else if(k===0)q.w=0;
      hp[k]=ph;let v=2*ph-1;
      if(ph<d){const t=ph/d;v-=t+t-t*t-1;}else if(ph>1-d){const t=(ph-1)/d;v-=t*t+t+t+1;}
      sum+=k?v*s:v;}
    q.ph=hp[0];return sum*q.nm;}
  let ph=q.ph+f;if(ph>=1||ph<0){q.w=ph>=1?1:0;ph-=Math.floor(ph);}else q.w=0;q.ph=ph;
  const pw=q.pw,pd=ph<pw?ph*0.5/pw:0.5+(ph-pw)*0.5/(1-pw),x=pd*TS,i=x|0,fr=x-i,A=q.tA,B=q.tB,a=A[i]+(A[i+1]-A[i])*fr;
  return a+(B[i]+(B[i+1]-B[i])*fr-a)*q.ff;
}
// ---------- voice ----------
class Voice{
  constructor(e){this.e=e;this.on=false;this.gate=false;this.key=-1;this.note=60;this.cur=60;this.vel=0;this.age=0;this.pan=0;this.ud=0;this.rnd=0;this.slide=0;this.id=0;
    this.o=[0,1,2].map(()=>({ph:0,z:0,w:0,nm:1,hp:new Float32Array(7),hi:new Float32Array(7),tA:null,tB:null,ff:0,pw:0.5}));
    this.sp=0;this.nz=0;this.aE={v:0,s:0};this.fE={v:0,s:0};this.mE={v:0,s:0};
    this.ld=new Float64Array(4);this.sv=new Float64Array(4);this.md=new Float32Array(24);this.dr=0;this.drT=0;this.drG=0;}
  start(n,vel,k,u,leg,poly){
    const e=this.e,fresh=!this.on;
    this.key=n;this.note=n;this.vel=vel;this.gate=true;this.id=++e.vid;
    this.ud=u>1?k/(u-1)*2-1:0;this.pan=this.ud;
    if(e.p.glide>0&&e.last>=0){if(fresh||poly)this.cur=e.last;}else this.cur=n;
    if(fresh){this.aE.v=this.fE.v=this.mE.v=0;this.ld.fill(0);this.sv.fill(0);this.nz=0;this.sp=0;this.slide=0;this.dr=0;
      for(const q of this.o){q.ph=u>1?Math.random():0;q.z=0;for(let j=0;j<7;j++)q.hp[j]=Math.random();}}
    if(!leg){this.aE.s=this.fE.s=this.mE.s=1;this.age=0;this.rnd=Math.random()*2-1;}
    this.on=true;
  }
  release(){this.gate=false;if(this.aE.s)this.aE.s=3;if(this.fE.s)this.fE.s=3;if(this.mE.s)this.mE.s=3;}
  render(L,R,off,n){
    const e=this.e,p=e.p,md=this.md,sr=e.sr,o=this.o;
    this.age+=n;
    const fE=es(this.fE,p.fS,e.cfA,e.cfD,e.cfR),mE=es(this.mE,p.mS,e.cmA,e.cmD,e.cmR);
    md.fill(0);
    const sl=e.slots;
    if(sl.length){const fd=e.fadeN>0?Math.min(1,this.age/e.fadeN):1;
      for(let j=0;j<sl.length;j++){const s=sl[j];let x;
        switch(s.s){case 1:x=e.lfo[0]*fd;break;case 2:x=e.lfo[1];break;case 3:x=e.lfo[2];break;case 4:x=fE;break;case 5:x=mE;break;
          case 6:x=this.vel;break;case 7:x=(this.cur-60)/24;break;case 8:x=e.mw;break;case 9:x=this.slide;break;case 10:x=this.rnd;break;default:x=this.aE.v;}
        md[s.d]+=x*s.a;}}
    this.cur+=(this.note-this.cur)*e.glc;
    if((this.drT-=n)<=0){this.drG=Math.random()*2-1;this.drT=sr*(0.15+Math.random()*0.5);}
    this.dr+=(this.drG-this.dr)*0.004;
    const base=this.cur+e.bend*2+md[1]+this.ud*p.udet*0.45+this.dr*p.drift*0.2;
    const inc=e.tI,lv=e.tL,sh=e.tS,wp=e.tW,om=e.om;
    for(let i=0;i<3;i++){
      const st=base+e.ose[i]+e.ode[i]*0.5+(i===1?md[2]:i===2?md[3]:0);
      let f=440*Math.pow(2,(st-69)/12)/sr;if(f>0.45)f=0.45;
      inc[i]=f;lv[i]=clp(e.olv[i]+md[15+i],0,1);sh[i]=clp(e.osh[i]+md[4+i],0,1);
      const w=clp(e.owp[i]+md[7],0,1),q=o[i],m=om[i];
      if(m===0)wp[i]=0.5+w*0.45;
      else if(m===1){const d=w*w*0.06+0.0004;for(let k=0;k<7;k++)q.hi[k]=f*(1+d*HC[k]);q.nm=0.9/Math.sqrt(1+6*sh[i]*sh[i]);}
      else{const pos=sh[i]*(NF-1);let f0=pos|0;if(f0>NF-2)f0=NF-2;q.ff=pos-f0;
        let mm=Math.ceil(Math.log2(512*f));mm=mm<0?0:mm>NM-1?NM-1:mm;
        const T=WT[e.owt[i]];q.tA=T[f0][mm];q.tB=T[f0+1][mm];q.pw=0.5-w*0.45;}

        if(((nn-rootPc)%12+12)%12===0)k.classList.add('root');
        k.textContent=chordMode==='Off'?NN[nn%12]+(Math.floor(nn/12)-1):chordName(chordOf(nn));row.appendChild(k);}
      kb.appendChild(row);}
  }
}
function keyAt(e){const el=document.elementFromPoint(e.clientX,e.clientY);return el&&el.closest?el.closest('.key'):null;}
function kDown(e){const k=keyAt(e);if(!k)return;const r=k.getBoundingClientRect(),yf=clamp((e.clientY-r.top)/r.height,0,1);
  const notes=chordOf(+k.dataset.n),v=e.pointerType==='mouse'?0.8:0.5+0.5*yf;notes.forEach(n=>send({t:'on',n,v}));k.classList.add('dn');
  touches.set(e.pointerId,{k,notes,y0:e.clientY,hgt:r.height});}
function kUp(id){const t=touches.get(id);if(!t)return;t.notes.forEach(n=>send({t:'off',n}));t.k.classList.remove('dn');touches.delete(id);}
kb.addEventListener('pointerdown',e=>{e.preventDefault();wake();try{kb.setPointerCapture(e.pointerId);}catch(x){}kDown(e);});
kb.addEventListener('pointermove',e=>{const t=touches.get(e.pointerId);if(!t)return;const k=keyAt(e);
  if(k&&k!==t.k){kUp(e.pointerId);kDown(e);}else{const s=clamp((t.y0-e.clientY)/t.hgt*1.6,-1,1);t.notes.forEach(n=>send({t:'slide',n,v:s}));}});
['pointerup','pointercancel'].forEach(ev=>kb.addEventListener(ev,e=>kUp(e.pointerId)));
kb.addEventListener('contextmenu',e=>e.preventDefault());
// strip
{const ol=h('span','oct'),setO=d=>{oct=clamp(oct+d,0,6);ol.textContent='Oct '+oct;buildKb();};
  strip.appendChild(btn('\u2212',()=>setO(-1)));strip.appendChild(ol);strip.appendChild(btn('+',()=>setO(1)));ol.textContent='Oct '+oct;
  strip.children[0].setAttribute('aria-label','Octave down');strip.children[2].setAttribute('aria-label','Octave up');
  const ks=h('select');ks.id='keySel';ks.setAttribute('aria-label','Key');NN.forEach((n,i)=>ks.add(new Option(n,i)));ks.value=rootPc;ks.onchange=()=>{rootPc=+ks.value;buildKb();roll();};strip.appendChild(ks);
  const ss=h('select');ss.id='scaleSel';ss.setAttribute('aria-label','Scale');Object.keys(SCALES).forEach(n=>ss.add(new Option(n,n)));ss.value=scaleName;ss.onchange=()=>{scaleName=ss.value;buildKb();roll();};strip.appendChild(ss);
  const lb=btn(layout==='pads'?'Scale pads':'Piano',()=>{layout=layout==='pads'?'keys':'pads';lb.textContent=layout==='pads'?'Scale pads':'Piano';buildKb();});strip.appendChild(lb);
  const cs=h('select');cs.id='chordSel';cs.setAttribute('aria-label','Chord mode');['Off','Triad','7th','9th','Power'].forEach(n=>cs.add(new Option(n==='Off'?'Chords off':'Chords: '+n,n)));cs.onchange=()=>{chordMode=cs.value;buildKb();};strip.appendChild(cs);
  strip.appendChild(tog('arpOn','Arp'));
  strip.appendChild(btn('All notes off',()=>{send({t:'panic'});touches.clear();document.querySelectorAll('.key.dn').forEach(k=>k.classList.remove('dn'));}));
  const mb=btn('MIDI',()=>{if(!navigator.requestMIDIAccess){mb.textContent='No MIDI here';return;}
    navigator.requestMIDIAccess().then(m=>{const hook=()=>{let c=0;m.inputs.forEach(i=>{c++;i.onmidimessage=ev=>{const [st,a,b]=ev.data,cmd=st&0xf0;wake();
        if(cmd===0x90&&b>0)send({t:'on',n:a,v:b/127});else if(cmd===0x80||cmd===0x90)send({t:'off',n:a});
        else if(cmd===0xb0&&a===1)send({t:'mw',v:b/127});else if(cmd===0xe0)send({t:'bend',v:((b<<7|a)-8192)/8192});};});
        mb.textContent=c?'MIDI: '+c+' in':'MIDI: none found';mb.classList.toggle('on',c>0);};hook();m.onstatechange=hook;}).catch(()=>{mb.textContent='MIDI blocked';});});
  if(!PLUG)strip.appendChild(mb);}
// computer keyboard
const KMAP={a:0,w:1,s:2,e:3,d:4,f:5,t:6,g:7,y:8,h:9,u:10,j:11,k:12,o:13,l:14,p:15},kheld={};
document.addEventListener('keydown',e=>{if(e.repeat||e.metaKey||e.ctrlKey||/INPUT|SELECT/.test(e.target.tagName)||e.target.classList.contains('knob'))return;
  const k=e.key.toLowerCase();if(k==='z'||k==='x'){strip.children[k==='z'?0:2].click();return;}
  if(k in KMAP&&!kheld[k]){wake();const notes=chordOf(12*(oct+1)+KMAP[k]);kheld[k]=notes;notes.forEach(n=>send({t:'on',n,v:0.8}));}});
document.addEventListener('keyup',e=>{const k=e.key.toLowerCase(),n=kheld[k];if(n){n.forEach(x=>send({t:'off',n:x}));delete kheld[k];}});
if(!PLUG)window.addEventListener('blur',()=>send({t:'panic'}));
let rz=0;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(buildKb,150);});

// ---------- boot ----------
buildSel();showTab('osc');paintAll();syncSel();buildKb();roll();drawMorph();

// ---------- plugin bridge ----------
if(PLUG){
  setStatus(true,'Running as a plugin. Audio, MIDI and tempo come from the host.');
  window.__JUCE__.backend.addEventListener('strain',m=>{
    if(m.t==='state'){Object.assign(patch,m.p);if(m.n){patchName=m.n;patchIdx=PRESETS.findIndex(p=>p[0]===m.n);}paintAll();syncSel();}
    else if(m.t==='pv'){patch[m.k]=m.v;paint(m.k);if(/mode$|sync$/.test(m.k))relabel();}
    else if(m.t==='chord')onEng(m);
    else if(m.t==='scope')paintScope(m.d,0.001);
  });
  send({t:'hello'});
}
